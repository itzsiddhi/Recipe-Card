<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="recipeTitle">Recipe - Recipe Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Back Navigation -->
        <div class="back-navigation">
            <a href="homepage.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Back to Recipes
            </a>
        </div>

        <div class="recipe-card">
            <!-- Header Section -->
            <header class="recipe-header">
                <div class="recipe-image-container">
                    <img id="recipeImage" src="" alt="Recipe Image" class="recipe-image">
                    <div class="image-overlay">
                        <h1 class="recipe-title" id="recipeTitleMain">Loading...</h1>
                        <div class="recipe-meta">
                            <span class="prep-time">
                                <i class="fas fa-clock"></i>
                                <span id="recipePrepTime">Loading...</span>
                            </span>
                            <span class="servings">
                                <i class="fas fa-users"></i>
                                <span id="recipeServings">Loading...</span>
                            </span>
                            <span class="difficulty">
                                <i class="fas fa-star"></i>
                                <span id="recipeDifficulty">Loading...</span>
                            </span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Recipe Description -->
            <div class="recipe-description">
                <p id="recipeDesc">Loading recipe description...</p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <span class="progress-text" id="progressText">Ready to start cooking!</span>
            </div>

            <!-- Timer Display -->
            <div class="timer-container" id="timerContainer">
                <div class="timer-display">
                    <i class="fas fa-stopwatch"></i>
                    <span id="timerDisplay">00:00</span>
                    <button class="timer-btn" id="pauseTimer">
                        <i class="fas fa-pause"></i>
                    </button>
                </div>
            </div>

            <!-- Ingredients Section -->
            <section class="ingredients-section">
                <div class="section-header" id="ingredientsHeader">
                    <h2>
                        <i class="fas fa-list-ul"></i>
                        Ingredients
                    </h2>
                    <button class="toggle-btn" id="ingredientsToggle">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
                <div class="section-content" id="ingredientsContent">
                    <ul class="ingredients-list" id="ingredientsList">
                        <!-- Ingredients will be loaded dynamically -->
                    </ul>
                </div>
            </section>

            <!-- Instructions Section -->
            <section class="instructions-section">
                <div class="section-header" id="instructionsHeader">
                    <h2>
                        <i class="fas fa-clipboard-list"></i>
                        Instructions
                    </h2>
                    <button class="toggle-btn" id="instructionsToggle">
                        <i class="fas fa-chevron-down"></i>
                    </button>
                </div>
                <div class="section-content" id="instructionsContent">
                    <ol class="instructions-list" id="instructionsList">
                        <!-- Instructions will be loaded dynamically -->
                    </ol>
                </div>
            </section>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="primary-btn" id="startCookingBtn">
                    <i class="fas fa-play"></i>
                    Start Cooking
                </button>
                <button class="secondary-btn" id="nextStepBtn" disabled>
                    <i class="fas fa-arrow-right"></i>
                    Next Step
                </button>
                <button class="secondary-btn" id="resetBtn">
                    <i class="fas fa-undo"></i>
                    Reset
                </button>
                <button class="secondary-btn" id="printBtn">
                    <i class="fas fa-print"></i>
                    Print Recipe
                </button>
            </div>

            <!-- Recipe Footer -->
            <footer class="recipe-footer">
                <div class="tips">
                    <h3><i class="fas fa-lightbulb"></i> Pro Tips</h3>
                    <ul id="proTips">
                        <!-- Pro tips will be loaded based on recipe -->
                    </ul>
                </div>
                
                <!-- Related Recipes -->
                <div class="related-recipes">
                    <h3><i class="fas fa-heart"></i> You might also like</h3>
                    <div class="related-grid" id="relatedRecipes">
                        <!-- Related recipes will be loaded dynamically -->
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="recipe.js"></script>
</body>
</html>
